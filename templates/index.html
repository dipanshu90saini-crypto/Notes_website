    <title>Study Notes</title>

    <h1 class="title">Class 9th to 12th Notes</h1>

<form class="search-box" action="/search" method="GET">
    <input
        type="text"
        name="q"
        placeholder="🔍 Search notes, subjects..."
        required
    >

    <button type="submit">Search</button>
</form>
