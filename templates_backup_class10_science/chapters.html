<!DOCTYPE html>
<html>
<head>
    <title>{{ subject }} - Class {{ class_no }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="navbar">
    📚 Study Notes
</div>

<div class="container">

    <h1 class="title">{{ subject }}</h1>

    <p class="subtitle">
        Class {{ class_no }} - Chapters
    </p>

    <div class="cards">

        {% for chapter in chapters %}
<a href="/class/{{ class_no }}/subject/{{ subject }}/chapter/{{ loop.index }}">
    📖 {{ chapter["chapter"] }}
</a>

        {% endfor %}

    </div>

    <a class="back" href="/class/{{ class_no }}">
        ⬅️ Back to Subjects
    </a>

</div>

</body>
</html>
